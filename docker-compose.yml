version: "3.8"

services:
  v12:
    image: felddy/foundryvtt:12
    hostname: my_foundry_host
    init: true
    volumes:
      - type: bind
        source: ./data
        target: /data
    environment:
      - FOUNDRY_PASSWORD
      - FOUNDRY_USERNAME
      - CONTAINER_PRESERVE_CONFIG
      - FOUNDRY_SSL_CERT=localhost.pem
      - FOUNDRY_SSL_KEY=localhost.key
    ports:
      - target: 30000
        published: 30000
        protocol: tcp
  v13:
    image: felddy/foundryvtt:13
    hostname: my_foundry_host
    init: true
    volumes:
      - type: bind
        source: ./data
        target: /data
    environment:
      - FOUNDRY_PASSWORD
      - FOUNDRY_USERNAME
      - CONTAINER_PRESERVE_CONFIG
      - FOUNDRY_SSL_CERT=localhost.pem
      - FOUNDRY_SSL_KEY=localhost.key
    ports:
      - target: 30000
        published: 30000
        protocol: tcp

  v14:
    image: felddy/foundryvtt:14
    hostname: my_foundry_host
    init: true
    volumes:
      - type: bind
        source: ./data
        target: /data
    environment:
      - FOUNDRY_PASSWORD
      - FOUNDRY_USERNAME
      - CONTAINER_PRESERVE_CONFIG=true
      - FOUNDRY_SSL_CERT=localhost.pem
      - FOUNDRY_SSL_KEY=localhost.key
    ports:
      - target: 30000
        published: 30000
        protocol: tcp